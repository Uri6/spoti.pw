name: DynamicTabBarProbe
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CLANG_ENABLE_OBJC_ARC: YES
    HEADER_SEARCH_PATHS: $(SRCROOT)/../../tweak/Sources
targets:
  DynamicTabBarProbe:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../tweak/Sources/Redesigned/NowPlayingBar/LiveBarLayout.m
      - path: ../../tweak/Sources/Redesigned/NowPlayingBar/LiveBarConstraints.m
      - path: ../../tweak/Sources/Redesigned/Navbar/DynamicBarScrollDriver.m
      - path: ../../tweak/Sources/Redesigned/Navbar/DynamicBarExpansion.m
      - path: ../../tweak/Sources/Redesigned/Navbar/DynamicBarHost.m
      - path: ../../tweak/Sources/Redesigned/Navbar/DynamicBarCapabilities.m
      - path: ../../tweak/Sources/Redesigned/Navbar/DynamicBarPolicy.m
      - path: ../../tweak/Sources/Redesigned/Navbar/DynamicBarCoordinator.m
      - path: ../../tweak/Sources/Core/SGViewTree.m
      - path: ../../tweak/Sources/Core/SGLog.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.spoti.dynamic-tabbar-probe
    info:
      path: build/Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: ProbeScene
  DynamicTabBarProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DynamicTabBarProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.spoti.dynamic-tabbar-probe.tests
        GENERATE_INFOPLIST_FILE: YES
  DynamicTabBarLayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: DynamicTabBarProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pw.spoti.dynamic-tabbar-probe.layout-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DynamicTabBarProbe:
    build:
      targets:
        DynamicTabBarProbe: all
    test:
      targets: [DynamicTabBarProbeTests, DynamicTabBarLayoutTests]
